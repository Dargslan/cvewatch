# Serve cvewatch reports on the LAN only, with basic authentication.
#   sudo htpasswd -c /etc/nginx/cvewatch.htpasswd admin
#   sudo usermod -aG cvewatch www-data   (read access to the report directory)
server {
    listen 192.168.10.30:8443 ssl;
    server_name sec01.lab;
    ssl_certificate     /etc/ssl/certs/sec01.pem;
    ssl_certificate_key /etc/ssl/private/sec01.key;

    allow 192.168.10.0/24;
    deny all;
    auth_basic "cvewatch";
    auth_basic_user_file /etc/nginx/cvewatch.htpasswd;

    root /var/lib/cvewatch/reports;
    index cvewatch-report.html;
}
