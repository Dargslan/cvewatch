# /etc/cvewatch/cvewatch.ini - cvewatch configuration
# Every value shown here is the default. Remove the leading # only where you change something.
[general]
data_dir = /var/lib/cvewatch
report_dir = /var/lib/cvewatch/reports
hosts_file = /etc/cvewatch/hosts.ini
exceptions_file = /etc/cvewatch/exceptions.csv
cache_hours = 20
keep_reports = 30

[sources]
osv = yes
kev = yes
epss = yes
include_kernel = yes

[priority]
p1_epss = 0.5
p2_epss = 0.1

[alerts]
# priorities at or above this level trigger an alert (P1, P2, P3 or P4)
min_priority = P2
ntfy_url =
# example: ntfy_url = https://ntfy.sh/your-long-random-topic
ntfy_token =
webhook_url =
# Slack, Mattermost, Discord or any endpoint that accepts JSON
email_to =
email_from = cvewatch@localhost
smtp_host = localhost
smtp_port = 25

[output]
prometheus_file =
# example: prometheus_file = /var/lib/cvewatch/cvewatch.prom
