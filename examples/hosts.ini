# /etc/cvewatch/hosts.ini - which hosts cvewatch scans
#
# address      local | IP or DNS name reachable over SSH | file:/path/inventory.json (offline host)
# user         SSH user on the target (default: current user; recommended: cvewatch)
# port         SSH port (default 22)
# identity     private key (default: ~/.ssh/id_ed25519 of the cvewatch user)
# python       interpreter on the target (default python3; RHEL 8: /usr/libexec/platform-python)
# mode         push (send the collector over SSH, default) | installed (run cvewatch on the target)
# exposure     internet | lan | internal | isolated   -> drives priority
# criticality  high | medium | low                     -> high raises priority one level
# enabled      no to skip a host temporarily

[scanner]
address = local
exposure = internal
criticality = medium

[docker01]
address = 192.168.10.20
user = cvewatch
exposure = internet
criticality = high

[srv01]
address = 192.168.10.10
user = cvewatch
exposure = lan
criticality = medium

[pve01]
address = 192.168.10.5
user = cvewatch
exposure = lan
criticality = high
